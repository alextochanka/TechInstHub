{% extends "base.html" %}
{% block title %}Вход — TechInstHub{% endblock %}
{% block hero_title %}Вход в аккаунт{% endblock %}
{% block content %}
<div class="ui-vstack gap-32 align-center max-w-md mx-auto">
    <form method="post" class="ui-vstack gap-20 w-full">
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Email</label>
            <input type="email" name="email" required class="ui-input p-3 rounded-xl border-gray">
        </div>
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Пароль</label>
            <div class="relative">
                <input type="password" name="password" id="password" required class="ui-input p-3 rounded-xl border-gray w-full pr-10">
                <button type="button" id="togglePassword" class="password-toggle">
                    <img src="{{ url_for('static', filename='icons/Eye-off.svg') }}" width="24" height="24" id="eyeIcon" alt="Показать пароль">
                </button>
            </div>
        </div>
        <button type="submit" class="ui-button primary m">Войти</button>
    </form>
    <div class="ui-text center">Нет аккаунта? <a href="{{ url_for('register') }}" class="ui-link primary">Зарегистрироваться</a></div>
</div>
{% endblock %}
