<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование проекта — TechInstHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
<div class="nav-links">
    <a href="{{ url_for('index') }}">Главная</a>
    <a href="{{ url_for('catalog') }}">Проекты</a>
    <a href="{{ url_for('news_list') }}">Новости</a>
    <a href="{{ url_for('profile') }}">Профиль</a>
    <a href="{{ url_for('chats_list') }}">Сообщения</a>
</div>
<div class="container">
    <div class="hero">
        <div class="hero-content">
            <div class="hero-left">
                <h1 class="hero-title">Редактирование проекта</h1>
            </div>
        </div>
    </div>
    <div class="content max-w-lg mx-auto p-6 rounded-2xl">
        <div class="ui-vstack gap-20">
            <div class="filter-group">
                <label class="ui-heading xs">название проекта</label>
                <input type="text" id="projectName" class="ui-input w-full p-3 rounded-xl" value="Дизайн мобильного приложения">
            </div>
            <div class="filter-group">
                <label class="ui-heading xs">короткое описание</label>
                <input type="text" id="shortDescription" class="ui-input w-full p-3 rounded-xl" value="Разработка интерфейса">
            </div>
            <div class="filter-group">
                <label class="ui-heading xs">тема</label>
                <select id="theme" class="ui-input w-full p-3 rounded-xl">
                    <option>UI/UX</option>
                    <option>Web-разработка</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="ui-heading xs">статус</label>
                <div class="ui-hstack gap-16">
                    <label><input type="radio" name="status" value="завершен"> завершен</label>
                    <label><input type="radio" name="status" value="открыт" checked> открыт</label>
                </div>
            </div>
            <button id="saveBtn" class="ui-button primary m">Изм.</button>
            <hr>
            <div class="filter-group">
                <label><input type="checkbox" id="teacher1Checkbox"> написать преподавателю</label>
                <div id="teacher1Message" style="display:none;" class="mt-2">
                    <textarea rows="3" class="ui-input w-full p-3 rounded-xl"></textarea>
                    <button class="ui-button s mt-2">отправить</button>
                </div>
            </div>
            <div id="saveMessage" class="ui-text success"></div>
        </div>
    </div>
    <footer class="footer">...</footer>
</div>
</body>
</html>
