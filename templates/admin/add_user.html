{% extends "base.html" %}
{% block title %}Добавить пользователя{% endblock %}
{% block hero_title %}Добавление преподавателя/администратора{% endblock %}
{% block content %}
<div class="ui-vstack gap-32 align-center" style="max-width: 600px; margin: 0 auto;">
    <form method="post" class="ui-vstack gap-20" style="width: 100%;" id="addUserForm">
        
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Имя <span class="ui-text error">*</span></label>
            <input type="text" name="name" required class="ui-input">
        </div>
        
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Фамилия <span class="ui-text error">*</span></label>
            <input type="text" name="surname" required class="ui-input">
        </div>
        
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Email <span class="ui-text error">*</span></label>
            <input type="email" name="email" required class="ui-input">
        </div>
        
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Роль <span class="ui-text error">*</span></label>
            <select name="role" class="ui-input" required>
                <option value="" disabled selected>-- Выберите роль --</option>
                <option value="teacher">Преподаватель</option>
                <option value="admin">Администратор</option>
            </select>
        </div>
        
        <div class="ui-vstack gap-8">
            <label class="ui-text semibold">Пароль <span class="ui-text error">*</span></label>
            <div style="position: relative;">
                <input type="password" name="password" id="passwordAdmin" required class="ui-input" style="padding-right: 40px;">
                <button type="button" id="togglePasswordAdmin" class="password-toggle">
                    <img src="{{ url_for('static', filename='icons/Eye-off.svg') }}" width="24" height="24" id="eyeIconAdmin" alt="Показать пароль">
                </button>
            </div>
            <div id="passwordHints" class="ui-vstack gap-1" style="margin-top: 12px;">
                <div class="password-hint"><span id="length-icon">❌</span> 8–14 символов</div>
                <div class="password-hint"><span id="upper-icon">❌</span> Заглавная буква (A–Z)</div>
                <div class="password-hint"><span id="lower-icon">❌</span> Строчная буква (a–z)</div>
                <div class="password-hint"><span id="special-icon">❌</span> Специальный символ (!@#$%^&* и др.)</div>
            </div>
        </div>
        
        <button type="submit" class="ui-button primary m" style="margin-top: 12px;">Создать</button>
    </form>
</div>
{% endblock %}
