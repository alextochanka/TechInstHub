{% extends "base.html" %}
{% block title %}Чат — {{ chat_name }}{% endblock %}
{% block hero_title %}{{ chat_name }}{% endblock %}
{% block content %}
<div class="chat-container">
    <div id="messages" class="chat-messages">
        {% for msg in messages %}
        <div class="chat-message {% if msg.sender_id == session.user_id %}chat-message-mine{% else %}chat-message-other{% endif %}">
            <div class="chat-message-sender">{{ msg.name }} {{ msg.surname }}</div>
            <div class="ui-text">{{ msg.content }}</div>
            <div class="chat-message-time">{{ msg.sent_at.strftime('%H:%M %d.%m') }}</div>
        </div>
        {% endfor %}
    </div>
    <form method="post" action="{{ url_for('send_message', chat_id=chat_id) }}" class="chat-form">
        <textarea name="content" rows="2" required class="ui-input chat-input" placeholder="Введите сообщение..."></textarea>
        <button type="button" class="ui-button outline s" data-attach-alert>
            <img src="{{ url_for('static', filename='icons/attach.svg') }}" width="24" height="24" alt="Прикрепить">
        </button>
        <button type="submit" class="ui-button primary m">
            <img src="{{ url_for('static', filename='icons/send.svg') }}" width="24" height="24" alt="Отправить">
        </button>
    </form>
</div>
{% endblock %}
