{% extends "base.html" %}
{% block title %}Оставить отзыв{% endblock %}
{% block hero_title %}Оставить отзыв{% endblock %}
{% block content %}
<form method="post" class="ui-vstack gap-24 max-w-md mx-auto">
    <div class="filter-group">
        <label class="ui-text semibold">
            {% if session.role == 'teacher' %}Студент{% else %}Преподаватель{% endif %}
        </label>
        <select name="recipient_id" class="ui-input w-full">
            {% for r in recipients %}
            <option value="{{ r.id }}">{{ r.name }} {{ r.surname }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-group">
        <label class="ui-text semibold">Оценка</label>
        <div class="rating-input">
            <input type="hidden" name="rating" id="ratingValue" value="5">
            <div class="stars">
                <span class="star filled" data-value="1">★</span>
                <span class="star filled" data-value="2">★</span>
                <span class="star filled" data-value="3">★</span>
                <span class="star filled" data-value="4">★</span>
                <span class="star filled" data-value="5">★</span>
            </div>
        </div>
    </div>
    <div class="filter-group">
        <label class="ui-text semibold">Комментарий</label>
        <textarea name="comment" rows="4" class="ui-input w-full"></textarea>
    </div>
    <button type="submit" class="ui-button primary m">Отправить отзыв</button>
</form>
{% endblock %}
